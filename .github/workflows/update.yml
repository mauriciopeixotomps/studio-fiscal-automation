name: Atualiza dashboard Studio Fiscal

on:
  # Disparado por um cron externo (cron-job.org), não pelo `schedule:` do GitHub
  # Actions — o agendamento nativo dele é "melhor esforço" e vinha atrasando
  # várias horas, especialmente com gatilhos frequentes (a cada 30 min).
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      PIPEDRIVE_TOKEN: ${{ secrets.PIPEDRIVE_TOKEN }}
      GITHUB_DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instala dependências
        run: pip install -r requirements.txt

      - name: Fetch Pipedrive
        run: python fetch_pipedrive.py

      - name: Sync automático da Previsão (produto + valor + data esperada -> linha na planilha)
        run: python sync_previsao_auto_add.py
        continue-on-error: true  # não-fatal de propósito — sem credencial ainda, ou falha da API do Sheets, não deve travar o resto do ciclo

      - name: Fetch previsão (planilha)
        run: python fetch_previsao.py

      - name: Build + deploy
        run: bash deploy.sh "Auto-update $(date '+%d/%m %H:%M UTC')"
